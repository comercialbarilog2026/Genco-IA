<body>
<header class="top"><div class="top-in"><h1 class="mark"><img class="logo-l" src="/brand/genco-escuro.png" alt="GENCO" width="132" height="33"><img class="logo-d" src="/brand/genco-branco.png" alt="" aria-hidden="true" width="132" height="33"><span>IA</span></h1>
  <div class="ctl"><button type="button" class="txtbtn" id="bOut">Sair do grupo</button></div></div></header>
<main class="view"><div class="page quem" id="quem">
  <div class="brief"><span class="cap" id="qCap">Carregando…</span><h2 class="brief-h">Quem está usando?</h2>

  <div class="qgrid" id="qGrid"></div>
  <form class="qpass" id="qPass" hidden>
    <p id="qPassTxt"></p>
    <div class="field"><label for="qSenha">Sua senha</label><input id="qSenha" type="password" autocomplete="current-password"></div>
    <p class="formerr" id="qErr" role="alert"></p>
    <div class="actions"><button type="submit" class="btn">Entrar</button><button type="button" class="btn ghost" id="qBack">Voltar</button></div>
  </form>
  <p class="formerr" id="qErr2" role="alert"></p>
</div></main>
